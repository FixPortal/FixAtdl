name: ci

on:
  # Deliberately narrow: all-branch pushes fire a second full run on every PR commit.
  # Concurrency does not safely solve that because push and PR refs differ.
  # Regression signal: two runs with one head SHA, one push and one pull_request.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Restoring the private FixPortal.CodeStyle package needs read:packages.
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflow and shell scripts
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore local tools
        run: dotnet tool restore

      - name: Check C# formatting
        run: dotnet csharpier check .

      - name: Restore
        run: dotnet restore FixPortal.FixAtdl.slnx

      - name: Build
        run: dotnet build FixPortal.FixAtdl.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution FixPortal.FixAtdl.slnx -c Release --no-build --report-xunit-trx --timeout 5m

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/*.trx'

  gate-coverage:
    name: Gate coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert every job in this workflow is gated
        env:
          GATE_EXEMPT: ''
        run: python3 .github/scripts/assert_gate_coverage.py .github/workflows/ci.yml

  # Required status check. Deliberately a pure aggregator of needs.*.result: it decides
  # what can merge, so it has no checkout, no parser and no network of its own.
  #
  # `if: always()` is load-bearing. Without it the job is SKIPPED when an upstream job
  # fails, a skipped job emits no check run at all, and a required context that never
  # reports leaves the pull request permanently unmergeable.
  #
  # `skipped` counts as a pass, which is what lets job-level `if:` conditions and path
  # filtering work; `failure` and `cancelled` do not.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [build-and-test, gate-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any upstream job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Upstream results: ${{ join(needs.*.result, ', ') }}"
          exit 1
